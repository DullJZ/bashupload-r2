name = "bashupload"
main = "src/index.js"
compatibility_date = "2025-08-16"

# 启用workers.dev
workers_dev = true

# 绑定域名
routes = [
	{ pattern = "bashupload.app", custom_domain = true }
]

# R2 存储桶绑定
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bashupload"

# 上传限流 - 单 IP 每 60 秒最多 10 次上传（period 仅支持 10 或 60）
# 注意：修改 period 后需同步更新 src/index.js 中 429 响应的提示文案和 Retry-After 值（绑定 API 不返回剩余时间）
[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# 环境变量
[vars]
MAX_UPLOAD_SIZE = "5368709120"
MAX_AGE = "3600"
SHORT_URL_SERVICE = "https://suosuo.de/short"
PASSWORD = ""
MAX_AGE_FOR_MULTIDOWNLOAD = "86400"
NO_CLEANUP = "false"
ENABLE_DEDUP = "true"

# 静态文件
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/*"]

# 开启日志
[observability.logs]
enabled = true

# 定时任务 - 每5分钟执行一次清理
[triggers]
crons = ["*/5 * * * *"]
